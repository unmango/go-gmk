GENERATOR:
  PackageName: gnumake
  PackageDescription: Package gnumake provides the raw cgo bindings generated from gnumake.h
  PackageLicense: THE AUTOGENERATED LICENSE. ALL THE RIGHTS ARE RESERVED BY ROBOTS.
  SysIncludes:
    - gnumake.h

PARSER:
  IncludePaths:
    - /usr/include
    # macOS
    # - /usr/local/include
  SourcesPaths:
    - gnumake.h

TRANSLATOR:
  Rules:
    global:
      # gmk_add_function needs a callback bridge that copies its result into
      # gmk_alloc memory, which c-for-go cannot express, so it is bound by hand.
      - {action: ignore, from: ^gmk_add_function$}
      - {action: ignore, from: ^gmk_func_ptr$}
      # gmk_eval takes a const gmk_floc*, but c-for-go emits a pack step after
      # the call that rebuilds wrappers over memory it has already released, so
      # Eval is bound by hand too.
      - {action: ignore, from: ^gmk_eval$}
      - {action: accept, from: ^gmk_}
      - {action: replace, from: ^gmk_}
      - {action: replace, from: ^filenm, to: file_name}
      - {action: replace, from: ^lineno, to: line_number}
    type:
      - {action: replace, from: ^floc, to: file_location}
      - {load: snakecase}
    function:
      - {load: snakecase}
    private:
      - {load: snakecase}
      - {transform: unexport}
    post-global:
      - {transform: export}
  PtrTips:
    function:
      - {target: ^gmk_free$, self: ref}
